<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Abstimmung</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f0f5f2; --surface:#fff; --text:#1a3d32; --muted:#5a7a6e; --border:#d8e5e0;
      --accent:#22a855; --brand-dark:#1a3d32; --radius:14px; --shadow:0 10px 30px rgba(34,168,85,.08);
    }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);
      background:radial-gradient(900px 450px at 20% -10%, rgba(34,168,85,.12), transparent 60%), var(--bg);}
    .topbar{background:linear-gradient(90deg,var(--brand-dark),#2d5644);color:#fff;border-bottom:3px solid var(--accent);box-shadow:0 4px 20px rgba(34,168,85,.15)}
    .topbar-inner{max-width:960px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .brand{display:flex;gap:10px;align-items:center;font-weight:700}
    .school-info{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.5px}
    .badge{width:14px;height:14px;border-radius:4px;background:var(--accent)}
    .nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;cursor:pointer}
    .nav button:hover{background:rgba(34,168,85,.2);border-color:rgba(34,168,85,.4)}
    .container{max-width:960px;margin:26px auto;padding:0 18px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:grid;gap:14px}
    .question{font-size:18px;font-weight:700}
    .actions{display:grid;gap:10px}
    .btn{border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:#fff}
    .btn.primary{background:var(--accent);color:#fff;border-color:rgba(34,168,85,.2)}
    .results{white-space:pre-line;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:var(--muted)}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="badge"></span> Brechtwahl</div>
      <div class="school-info">brecht schule hamburg</div>
      <div class="nav">
        <button onclick="go('polls.html')">Übersicht</button>
        <button onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div id="question" class="question">Frage wird geladen …</div>

      <div class="actions">
        <button class="btn primary" onclick="submitVote('yes')">Ja</button>
        <button class="btn" onclick="submitVote('no')">Nein</button>
      </div>

      <button class="btn" onclick="loadPublicResults()">Ergebnisse laden</button>
      <div id="results" class="results"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
